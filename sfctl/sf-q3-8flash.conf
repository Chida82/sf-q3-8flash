# sfctl service config for sf-q3-8flash (read by sfctl/sfctl; see sfctl/README.md).
# Relative paths resolve against the serve worktree, the agent's working
# directory. @HOME@ becomes ~/.sf/q3-8flash when the agent is written.
#
# The service: Q4 weights resident (about 70 GiB, no SSD streaming), the
# Qwen3-VL projector, the native 256K context, built-in MTP with exact
# sampling (greedy output and the sampling distribution stay those of a plain
# run), and a 32 GiB disk KV cache in ~/.sf/q3-8flash/kv.

# Service port on 127.0.0.1 (sfctl ports: 8909-8912, one per child).
SF_PORT=8912
# The server binary, built in serve by `make <name>`.
SF_SERVER=sf-q3-8flash-server
# component:path pairs: ./download.sh <component> links <path> when it is missing.
SF_COMPONENTS="q4:qwen3.8-flash-next.gguf vision:gguf/mmproj-Qwen3.8-Flash-Next-Q8_0.gguf"
# Server options after --port. No option may contain a space.
SF_ARGS='--vision gguf/mmproj-Qwen3.8-Flash-Next-Q8_0.gguf --ctx 262144 --tokens 65536 --mtp --mtp-exact-sampling --kv-disk-dir @HOME@/kv --kv-disk-space-mb 32768'
