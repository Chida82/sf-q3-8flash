# sfctl service config for sf-q3-8flash (read by sfctl/sfctl; see sfctl/README.md).
# Relative paths resolve against the serve worktree, the agent's working
# directory. @HOME@ becomes ~/.sf/q3-8flash and @VARIANT@ the variant's name
# when the agent is written.
#
# One service, three variants; the name given to start picks the weights:
#   q3-8flash-q4   Q4 weights resident (about 70 GiB), for 128 GB Macs
#   q3-8flash-q2   Q2 weights resident (about 42 GiB), for 64 GB Macs
#   q3-8flash-q4s  Q4 weights with SSD streaming, the routed experts in a
#                  fixed cache of 11,831 slots: about 54 GiB planned with the
#                  projector, so other work keeps the rest of a 128 GB Mac
#                  (change 199; rates in docs/SSD_STREAMING.md, capped RAM)
# All: the Qwen3-VL projector, the native 256K context,
# built-in MTP with exact sampling (greedy output and the sampling
# distribution stay those of a plain run), and a 32 GiB disk KV cache of
# their own in ~/.sf/q3-8flash/kv-<variant>: Q4 and Q2 checkpoints are not
# interchangeable, and q4s keeps its own so the two Q4 variants' space limits
# stay apart. ~/.sf/q3-8flash/kv, the cache before variants, is no
# longer used.
#
# Each variant passes its own fixed link gguf/Qwen3.8-Flash-Next-<Q>.gguf with
# -m, never the root default link qwen3.8-flash-next.gguf, which changes during
# development. install and update create every variant's link that serve lacks
# through ./download.sh <variant>; as a side effect that re-points serve's
# default link, which is harmless because the service never reads it. start
# never links or downloads anything.

# Service port on 127.0.0.1 (sfctl ports: 8909-8912, one per child).
SF_PORT=8912
# The server binary, built in serve by `make <name>`.
SF_SERVER=sf-q3-8flash-server
# component:path pairs that install and update link when missing, besides the
# variants' models.
SF_COMPONENTS="vision:gguf/mmproj-Qwen3.8-Flash-Next-Q8_0.gguf"
# Variants, the first being the one an agent written before variants ran;
# SF_MODEL_<variant> is the component:path of its model, linked like a
# component.
SF_VARIANTS="q4 q2 q4s"
SF_MODEL_q4=q4:gguf/Qwen3.8-Flash-Next-Q4.gguf
SF_MODEL_q2=q2:gguf/Qwen3.8-Flash-Next-Q2.gguf
SF_MODEL_q4s=q4:gguf/Qwen3.8-Flash-Next-Q4.gguf
# Server options after --port and -m. No option may contain a space.
SF_ARGS='--vision gguf/mmproj-Qwen3.8-Flash-Next-Q8_0.gguf --ctx 262144 --tokens 65536 --mtp --mtp-exact-sampling --kv-disk-dir @HOME@/kv-@VARIANT@ --kv-disk-space-mb 32768'
# Options for one variant alone, after SF_ARGS.
SF_ARGS_q4s='--ssd-streaming --ssd-streaming-cache-experts 11831'
