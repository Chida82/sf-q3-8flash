schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Analyzed upstream ds4 PRs and the verdict on each of their commits live in
  docs/upstream-prs.md. Proposals, designs and tasks consult it; a change that
  adopts or rejects a commit updates that commit's line in the same branch.
  Provenance of borrowed code goes in the registry and in commit messages, never
  in source comments.
  Change names use <NN>-<kebab-name>, numbered in execution order.
  Performance changes must not lose precision: no KV-cache or activation
  quantization, and no route that changes greedy output.
  Every performance change ends with tools/parity-check.sh sf-q3-8flash
  passing (from the StarForge checkout) and an A/B run of
  speed-bench/ab_bench.py against the start commit of the current segment of
  speed-bench/perf-record.md, and appends the printed row there. If the
  current segment has no start row yet, the change first writes it with an
  A/A run on a worktree of the start commit. Steps inside a change are judged
  with the same harness against the previous step. A step is kept when the
  pooled bootstrap 95% CI of its target metric (plain decode for decode work,
  the prefill metrics for prefill work), over all its A/B runs against the
  previous step, lies above zero, however small the gain, and no other
  throughput metric's pooled CI lies wholly below zero. A neutral step (CI
  across zero, nothing below) is kept only if it deletes more lines than it
  adds; no step is kept as neutral because a later step builds on it. A step
  that adds a tool and claims no speed needs bitwise output and no metric
  below zero. An inconclusive run is repeated once with a longer budget on
  the kinds that decide it.
  A prefill or decode step that changes kernels and whose predicted
  end-to-end effect is below the harness's resolution (a few percent on
  prefill, about one on decode) is decided on GPU time instead: ABBA pairs of
  DS4_QWEN4_TIMING=2 runs on the harness's prompts and frontiers, taking per
  prefill chunk and per decode pass the time of the sections the step
  targets divided by the time of the sections it does not touch, which
  cancels the clock drift between runs, pooled with a bootstrap 95% CI
  (`ab_bench.py --sections`, `ab_pool.py`). It is kept when
  that ratio's CI lies below one at a shape the step targets and above one at
  none; the harness then runs once as the guard (bitwise output, no
  throughput metric wholly below zero). A step that changes scheduling or
  overlap between kernels stays on the harness, since the section cuts hide
  overlap. Why: in 60-q4-expert-prefill a no-op step read prefill
  8192 +3% with a CI wholly above zero, while the section times resolved
  every step. Work never happens on main:
  main is only read, through a worktree.
  Code a change ports (from an upstream PR or elsewhere) or writes is not
  final as it first lands. Every change that adds code plans two reviews
  of it: a short one after each step, fixing only what would make the step
  wrong or break a child rule, and a final pass over the whole region it
  touched. The final pass checks it against AGENT.md and the surrounding
  idiom, deletes what the change made dead, and recovers missed speed. It
  applies what pays in correctness, speed or reading cost, keeping output
  identical (bitwise where the change claims it). The refinements are
  measured like a step. A change lands on main as one signed commit that
  includes its refinements.

